<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* font-family:fantasy; */
        }

        .container {
            height: 700px;
            width: 1000px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 2px solid black;
            border-radius: 10px;
            perspective: 1000px;
            background-color: skyblue;
        }

        .card {
            height: 200px;
            width: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: 1s;
            /* display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            border: 2px solid black;
             backface-visibility: hidden; */

        }

        .box {
            height: 100%;
            width: 100%;
            display: flex;
            font-size: 45px;
            font-weight: bold;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            position: absolute;
            backface-visibility: hidden;

        }

        .front1 {
            background-color: goldenrod;
            transform: rotateX(0deg);
        }

        .back1 {
            transform: rotateX(180deg);
            background-color: violet;
        }

        .card1:hover {
            transform: rotateX(180deg);
        }

        .front2 {
            transform: rotateY(0deg);
            background-color: salmon;
        }

        .back2 {
            transform: rotateY(180deg);
            background-color: brown;
        }

        .card2:hover {
            transform: rotateY(180deg);
        }

        .card3{
            animation: slider 4s infinite;
        }

        .front3 {
            transform: rotateX(0deg);
            background-color: crimson;
        }

        .back3 {
            transform: rotateX(180deg);
            background-color: red;
        }

        @keyframes slider {

            0%,
            40% {
                transform: rotateX(0deg);
            }

            50%,
            90% {
                transform: rotateX(180deg);
            }

            100% {
                transform: rotateX(360deg);
            }

        }

        .card4{
            animation: slider2 4s infinite;
        }

        .front4 {
            transform: rotateX(0deg);
            background-color: green;
        }

        .back4 {
            transform: rotateY(180deg);
            background-color: palevioletred;
        }

        @keyframes slider2 {

            0%,
            40% {
                transform: rotateY(0deg);
            }

            50%,
            90% {
                transform: rotateY(180deg);
            }

            100% {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card card1">
            <div class="box front1">front</div>
            <div class="box back1">back</div>
        </div>
        <div class="card card2">
            <div class="box front2">front</div>
            <div class="box back2">back</div>

        </div>
        <div class="card card3">
            <div class="box front3">front</div>
            <div class="box back3">back</div>

        </div>
        <div class="card card4">
            <div class="box front4">front</div>
            <div class="box back4">back</div>
        </div>

    </div>
</body>

</html>
